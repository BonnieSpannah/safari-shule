name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment to rollback
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      api_digest:
        description: API image digest (sha256:...)
        required: true
        type: string
      web_digest:
        description: Web image digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  deployments: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: rollback-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate digest inputs
        run: |
          for DIGEST in "${{ github.event.inputs.api_digest }}" "${{ github.event.inputs.web_digest }}"; do
            if ! echo "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
              echo "::error::Invalid digest format: $DIGEST"
              exit 1
            fi
          done

      - name: Trigger rollback webhook
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          DEV_WEBHOOK_URL: ${{ secrets.DEV_DEPLOY_WEBHOOK_URL }}
          STAGING_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
          PRODUCTION_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
          DEV_WEBHOOK_TOKEN: ${{ secrets.DEV_DEPLOY_WEBHOOK_TOKEN }}
          STAGING_WEBHOOK_TOKEN: ${{ secrets.STAGING_DEPLOY_WEBHOOK_TOKEN }}
          PRODUCTION_WEBHOOK_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          case "$TARGET_ENV" in
            dev)
              WEBHOOK_URL="$DEV_WEBHOOK_URL"
              WEBHOOK_TOKEN="$DEV_WEBHOOK_TOKEN"
              ;;
            staging)
              WEBHOOK_URL="$STAGING_WEBHOOK_URL"
              WEBHOOK_TOKEN="$STAGING_WEBHOOK_TOKEN"
              ;;
            production)
              WEBHOOK_URL="$PRODUCTION_WEBHOOK_URL"
              WEBHOOK_TOKEN="$PRODUCTION_WEBHOOK_TOKEN"
              ;;
            *)
              echo "::error::Unsupported environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Missing deployment webhook secret for environment: $TARGET_ENV"
            exit 1
          fi

          AUTH_HEADER=""
          if [ -n "$WEBHOOK_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $WEBHOOK_TOKEN"
          fi

          curl --fail --show-error --silent --location \
            --request POST \
            --header "Content-Type: application/json" \
            ${AUTH_HEADER:+--header "$AUTH_HEADER"} \
            --data @- \
            "$WEBHOOK_URL" <<EOF
          {
            "environment": "${TARGET_ENV}",
            "rollback": true,
            "requestedBy": "${{ github.actor }}",
            "images": {
              "api": "${{ env.REGISTRY }}/${{ github.repository_owner }}/safari-shule-api@${{ github.event.inputs.api_digest }}",
              "web": "${{ env.REGISTRY }}/${{ github.repository_owner }}/safari-shule-web@${{ github.event.inputs.web_digest }}"
            }
          }
          EOF
