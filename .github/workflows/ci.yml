name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @safari-shule/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck API tests
        run: pnpm --filter @safari-shule/api exec tsc --noEmit -p test/tsconfig.test.json

      - name: Typecheck Web
        run: pnpm --filter @safari-shule/web run typecheck

      - name: Build API
        run: pnpm --filter @safari-shule/api run build

      - name: Build Web
        run: pnpm --filter @safari-shule/web run build

      - name: Unit tests
        run: pnpm test

  mobile:
    name: Mobile Analyze, Test, Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter test
        working-directory: apps/mobile
        run: flutter test

      - name: Build release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
