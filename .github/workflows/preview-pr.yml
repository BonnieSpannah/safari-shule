name: Preview PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set preview image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "api_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/safari-shule-api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ env.REGISTRY }}/${{ github.repository_owner }}/safari-shule-web:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: ${{ steps.tags.outputs.api_image }}
          cache-from: type=gha,scope=preview-api
          cache-to: type=gha,mode=max,scope=preview-api

      - name: Build and push Web preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: ${{ steps.tags.outputs.web_image }}
          cache-from: type=gha,scope=preview-web
          cache-to: type=gha,mode=max,scope=preview-web

      - name: Trigger preview deployment
        env:
          PREVIEW_DEPLOY_WEBHOOK_URL: ${{ secrets.PREVIEW_DEPLOY_WEBHOOK_URL }}
          PREVIEW_DEPLOY_WEBHOOK_TOKEN: ${{ secrets.PREVIEW_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$PREVIEW_DEPLOY_WEBHOOK_URL" ]; then
            echo "::error::Missing required secret PREVIEW_DEPLOY_WEBHOOK_URL"
            exit 1
          fi

          AUTH_HEADER=""
          if [ -n "$PREVIEW_DEPLOY_WEBHOOK_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $PREVIEW_DEPLOY_WEBHOOK_TOKEN"
          fi

          curl --fail --show-error --silent --location \
            --request POST \
            --header "Content-Type: application/json" \
            ${AUTH_HEADER:+--header "$AUTH_HEADER"} \
            --data @- \
            "$PREVIEW_DEPLOY_WEBHOOK_URL" <<EOF
          {
            "environment": "preview-pr-${{ github.event.pull_request.number }}",
            "prNumber": ${{ github.event.pull_request.number }},
            "commitSha": "${{ github.sha }}",
            "images": {
              "api": "${{ steps.tags.outputs.api_image }}",
              "web": "${{ steps.tags.outputs.web_image }}"
            }
          }
          EOF

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewBase = process.env.PREVIEW_BASE_URL;
            if (!previewBase) {
              core.info('PREVIEW_BASE_URL not set; skipping PR comment.');
              return;
            }
            const url = `${previewBase.replace(/\/$/, '')}/pr-${context.payload.pull_request.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Preview environment ready: ${url}`,
            });
        env:
          PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}

  teardown-preview:
    name: Teardown Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger preview teardown
        env:
          PREVIEW_TEARDOWN_WEBHOOK_URL: ${{ secrets.PREVIEW_TEARDOWN_WEBHOOK_URL }}
          PREVIEW_TEARDOWN_WEBHOOK_TOKEN: ${{ secrets.PREVIEW_TEARDOWN_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TEARDOWN_WEBHOOK_URL" ]; then
            echo "::error::Missing required secret PREVIEW_TEARDOWN_WEBHOOK_URL"
            exit 1
          fi

          AUTH_HEADER=""
          if [ -n "$PREVIEW_TEARDOWN_WEBHOOK_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $PREVIEW_TEARDOWN_WEBHOOK_TOKEN"
          fi

          curl --fail --show-error --silent --location \
            --request POST \
            --header "Content-Type: application/json" \
            ${AUTH_HEADER:+--header "$AUTH_HEADER"} \
            --data @- \
            "$PREVIEW_TEARDOWN_WEBHOOK_URL" <<EOF
          {
            "environment": "preview-pr-${{ github.event.pull_request.number }}",
            "prNumber": ${{ github.event.pull_request.number }},
            "state": "closed"
          }
          EOF
