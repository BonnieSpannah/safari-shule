name: mobile
description: 'Safari Shule mobile app for driver, assistant, and parent flows.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  dio: ^5.9.0
  socket_io_client: ^3.1.2
  drift: ^2.29.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^8.2.0
  go_router: ^16.2.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^19.4.0
  firebase_messaging: ^16.0.4
  local_auth: ^2.3.0
  flutter_nfc_kit: ^3.6.0
  flutter_background_geolocation: ^4.18.0
  mobile_scanner: ^7.1.3
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  drift_dev: ^2.29.0
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
